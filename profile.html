<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Maslog Cold Spring — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --green-deep:#0d3b2e; --green-mid:#2d6a4f; --green-bright:#40916c; --green-mint:#e8f5e9; --text:#1a2e24; --text-muted:#6b7c74; --bg:#f6f8f6; --white:#fff; --serif:"Cormorant Garamond",Georgia,serif; --sans:"Outfit",sans-serif; --radius:18px; --nav-h:120px; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);display:flex;justify-content:center;min-height:100vh}
    a{text-decoration:none;color:inherit}
    .phone{width:100%;max-width:430px;min-height:100vh;padding:0 1.15rem calc(var(--nav-h) + 1.5rem);display:flex;flex-direction:column;gap:.85rem}
    .page-bar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:1rem 0 .85rem;background:rgba(246,248,246,.92);backdrop-filter:blur(12px);margin:0 -1.15rem;padding-left:1.15rem;padding-right:1.15rem}
    .back-btn{width:42px;height:42px;border-radius:50%;background:var(--white);display:grid;place-items:center;box-shadow:0 4px 14px rgba(13,59,46,.08);color:var(--green-deep)}
    .page-bar h1{font-family:var(--serif);font-size:1.35rem;text-align:center;color:var(--green-deep)}
    .profile-grid{display:grid;gap:.85rem}
    .hero-card{background:linear-gradient(165deg,#247a58,var(--green-deep));color:#fff;border-radius:22px;padding:1.35rem 1.1rem;text-align:center;box-shadow:0 12px 28px rgba(13,59,46,.2)}
    .avatar{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.35);margin:0 auto .65rem;display:grid;place-items:center;font-size:1.35rem;font-weight:700;overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .hero-card h2{font-family:var(--serif);font-size:1.3rem;margin-bottom:.15rem;line-height:1.2}
    .hero-card p{font-size:.8rem;opacity:.88;word-break:break-word}
    .badge{display:inline-flex;align-items:center;gap:.3rem;margin-top:.55rem;background:rgba(255,255,255,.18);padding:.35rem .7rem;border-radius:999px;font-size:.72rem;font-weight:600}
    .card{background:var(--white);border-radius:var(--radius);padding:1rem;box-shadow:0 6px 20px rgba(13,59,46,.06)}
    .card h3{font-size:.92rem;color:var(--green-deep);margin-bottom:.7rem}
    .details-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
    .detail-cell{background:#fafcfa;border:1px solid #e8eee9;border-radius:14px;padding:.7rem .55rem;text-align:center;min-width:0}
    .detail-cell span{display:block;font-size:.68rem;color:var(--text-muted);margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
    .detail-cell strong{display:block;font-size:.78rem;color:var(--green-deep);font-weight:650;line-height:1.3;word-break:break-word}
    .verify-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
    .verify-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;font-size:.72rem;font-weight:600;text-align:center;padding:.75rem .45rem;border-radius:14px;background:#fafcfa;border:1px solid #e8eee9;min-height:88px}
    .verify-item.ok{background:var(--green-mint);color:var(--green-mid);border-color:#c8e6c9}
    .verify-item.pending{background:#fff8e1;color:#f57f17;border-color:#ffe082}
    .verify-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
    .actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-top:.15rem}
    .btn{display:flex;align-items:center;justify-content:center;gap:.35rem;padding:.82rem .65rem;border-radius:16px;font-weight:600;font-size:.85rem;text-align:center;min-height:48px}
    .btn-ghost{background:var(--white);border:1px solid #d5e3da;color:var(--green-deep);box-shadow:0 4px 14px rgba(13,59,46,.05)}
    .btn-ghost svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
    .btn-logout{grid-column:1/-1;background:#fff1f0;border-color:#f5c6c2;color:#b42318}
    .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(.75rem,env(safe-area-inset-bottom));width:calc(100% - 1.75rem);max-width:400px;height:68px;z-index:50;display:grid;grid-template-columns:1fr 88px 1fr;align-items:center;padding:0 .35rem .15rem}
    .nav-shell{position:absolute;inset:0;z-index:-1;pointer-events:none;filter:drop-shadow(0 10px 24px rgba(13,59,46,.14))}
    .nav-shell svg{width:100%;height:100%}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:.28rem;font-size:.72rem;font-weight:500;color:#8a9a92;z-index:1}
    .nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
    .nav-item.active{color:var(--green-mid);font-weight:600}
    .nav-home{position:relative;top:-30px;display:flex;flex-direction:column;align-items:center;gap:.35rem;color:var(--green-mid);font-size:.72rem;font-weight:600;z-index:2}
    .nav-home .fab{width:60px;height:60px;border-radius:50%;background:linear-gradient(165deg,#247a58,var(--green-deep));color:#fff;display:grid;place-items:center;border:5px solid var(--bg);box-shadow:0 12px 28px rgba(13,59,46,.38)}
    .nav-home .fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}
    @media(min-width:431px){body{padding:1rem 0;background:#e8eee9}.phone{border-radius:28px;box-shadow:0 20px 50px rgba(13,59,46,.12);background:var(--bg)}}
  </style>
</head>
<body>
  <div class="phone">
    <header class="page-bar">
      <a class="back-btn" href="user-dashboard.html" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></a>
      <h1>Profile</h1><span></span>
    </header>

    <div class="profile-grid">
      <section class="hero-card">
        <div class="avatar" id="avatar"><span id="avatarInit">NF</span></div>
        <h2 id="profileName">—</h2>
        <p id="profileEmail">—</p>
        <span class="badge" id="statusBadge">Verified</span>
      </section>

      <section class="card">
        <h3>Account Details</h3>
        <div class="details-grid">
          <div class="detail-cell"><span>Mobile</span><strong id="pPhone">—</strong></div>
          <div class="detail-cell"><span>Valid ID</span><strong id="pIdType">—</strong></div>
          <div class="detail-cell"><span>Registered</span><strong id="pRegistered">—</strong></div>
        </div>
      </section>

      <section class="card">
        <h3>Verification Status</h3>
        <div class="verify-grid" id="verifyList"></div>
      </section>

      <div class="actions-grid">
        <a class="btn btn-ghost" href="book-online.html">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
          Book a Visit
        </a>
        <a class="btn btn-ghost" href="my-bookings.html">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          My Bookings
        </a>
        <button type="button" class="btn btn-ghost btn-logout" id="logoutBtn">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log Out
        </button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <div class="nav-shell" aria-hidden="true"><svg viewBox="0 0 400 68" preserveAspectRatio="none"><path fill="#fff" d="M28 0 H148 C158 0 164 6 170 14 C178 28 190 36 200 36 C210 36 222 28 230 14 C236 6 242 0 252 0 H372 C388 0 400 12 400 28 V68 H0 V28 C0 12 12 0 28 0 Z"/></svg></div>
    <a class="nav-item" href="partnership.html"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Partnership</a>
    <a class="nav-home" href="user-dashboard.html"><span class="fab"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21V12h6v9"/></svg></span>Home</a>
    <a class="nav-item active" href="profile.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Profile</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="maslog-db.js"></script>
  <script src="user-app.js"></script>
  <script>
    document.getElementById("logoutBtn").addEventListener("click", () => {
      MaslogDB.logout();
      location.href = "index.html";
    });

    (async function loadClientProfileFromDatabase() {
      const session = MaslogConfig.getSession();
      if (!session || session.role !== "client") {
        location.href = "index.html";
        return;
      }

      const user = await MaslogDB.getCurrentClient();
      if (!user) {
        document.getElementById("profileName").textContent = "No client profile";
        document.getElementById("profileEmail").textContent = session.email || "";
        document.getElementById("statusBadge").textContent = "Pending Setup";
        document.getElementById("pPhone").textContent = "-";
        document.getElementById("pIdType").textContent = "-";
        document.getElementById("pRegistered").textContent = "-";
        document.getElementById("verifyList").innerHTML = "";
        return;
      }

      document.getElementById("profileName").textContent = user.fullName || "Client";
      document.getElementById("profileEmail").textContent = user.email || "";
      document.getElementById("pPhone").textContent = user.phone || "-";
      document.getElementById("pIdType").textContent = user.idType || "-";
      document.getElementById("pRegistered").textContent = user.registeredAt
        ? new Date(user.registeredAt).toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" })
        : "-";
      document.getElementById("avatarInit").textContent = MaslogDB.initials(user.fullName);
      if (user.selfie) document.getElementById("avatar").innerHTML = `<img src="${user.selfie}" alt="Profile photo" />`;

      const verified = MaslogDB.isUserVerified(user);
      document.getElementById("statusBadge").textContent = verified
        ? "Verified Account"
        : user.status === "pending" ? "Pending Approval" : "Not Verified";

      const v = user.verified || {};
      const checks = [
        { label: "Gmail", ok: v.gmail },
        { label: "Selfie", ok: v.selfie },
        { label: "Valid ID", ok: v.id },
      ];
      document.getElementById("verifyList").innerHTML = checks.map((c) => `
        <div class="verify-item ${c.ok ? "ok" : "pending"}">
          <svg viewBox="0 0 24 24">${c.ok ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>' : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}</svg>
          <span>${c.label}</span>
        </div>`).join("");
    })().catch((err) => {
      document.getElementById("profileName").textContent = "Profile unavailable";
      document.getElementById("profileEmail").textContent = err.message || "";
    });
  </script>
</body>
</html>
