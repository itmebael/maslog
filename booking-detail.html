<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Maslog Cold Spring — My Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-deep: #0d3b2e;
      --green-mid: #2d6a4f;
      --green-bright: #40916c;
      --green-mint: #e8f5e9;
      --card-mint: #eef7f0;
      --text: #1a2e24;
      --text-muted: #6b7c74;
      --bg: #f6f8f6;
      --white: #ffffff;
      --sans: "Outfit", sans-serif;
      --pending: #d97706;
      --pending-bg: #fef3c7;
      --pending-soft: #fff8e8;
      --approved: #146c43;
      --approved-bg: #b7efc5;
      --approved-soft: #e8f8ef;
      --cancelled: #b91c1c;
      --cancelled-bg: #fecaca;
      --cancelled-soft: #fef2f2;
      --nav-h: 88px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; border: none; cursor: pointer; background: none; }

    .phone {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      padding: 0 0 calc(var(--nav-h) + 1rem);
      display: flex;
      flex-direction: column;
    }

    .page-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 1rem 1.15rem 0.95rem;
      background: rgba(246, 248, 246, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(13, 59, 46, 0.06);
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--white);
      color: var(--green-deep);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px rgba(13, 59, 46, 0.08);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .page-bar h1 {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green-deep);
    }

    .content {
      padding: 1.1rem 1.2rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .card {
      background: var(--white);
      border-radius: 18px;
      padding: 1.1rem 1.15rem;
      border: 1px solid rgba(13, 59, 46, 0.08);
      box-shadow: 0 8px 22px rgba(13, 59, 46, 0.05);
      animation: fadeUp 0.45s ease both;
    }

    .card:nth-child(2) { animation-delay: 0.05s; }
    .card:nth-child(3) { animation-delay: 0.1s; }
    .card:nth-child(4) { animation-delay: 0.15s; }
    .card:nth-child(5) { animation-delay: 0.2s; }

    /* Status hero */
    .status-hero {
      background: var(--card-mint);
      border-color: rgba(13, 59, 46, 0.1);
    }

    body[data-status="pending"] .status-hero { background: var(--pending-soft); }
    body[data-status="approved"] .status-hero,
    body[data-status="confirmed"] .status-hero { background: var(--approved-soft); }
    body[data-status="cancelled"] .status-hero { background: var(--cancelled-soft); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.35rem 0.7rem;
      border-radius: 8px;
      margin-bottom: 0.85rem;
    }

    .badge.pending { background: var(--pending-bg); color: var(--pending); }
    .badge.approved,
    .badge.confirmed { background: var(--approved-bg); color: var(--approved); }
    .badge.cancelled { background: var(--cancelled-bg); color: var(--cancelled); }

    .id-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 0.15rem;
    }

    .booking-id {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--green-mid);
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .booked-on {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Progress: Pending → Approved (check) | Cancelled (x) */
    .progress {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: flex-start;
      position: relative;
      padding: 0.35rem 0.25rem 0.15rem;
      gap: 0;
    }

    .progress-line {
      position: absolute;
      top: 22px;
      left: calc(16.66% + 12px);
      right: calc(16.66% + 12px);
      height: 3px;
      background: #e2e8e4;
      border-radius: 999px;
      z-index: 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.45s ease, background 0.3s ease;
    }

    /* Pending: short yellow pulse from start */
    body[data-status="pending"] .progress-fill {
      width: 12%;
      background: var(--pending);
    }

    /* Approved / Confirmed: line reaches the CHECK (middle) */
    body[data-status="approved"] .progress-fill,
    body[data-status="confirmed"] .progress-fill {
      width: 50%;
      background: var(--approved);
    }

    /* Cancelled: line reaches the X (end) */
    body[data-status="cancelled"] .progress-fill {
      width: 100%;
      background: var(--cancelled);
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      z-index: 1;
    }

    .step-dot {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e8ece9;
      color: #8a9a92;
      display: grid;
      place-items: center;
      border: 3px solid var(--white);
      box-shadow: 0 2px 8px rgba(13, 59, 46, 0.08);
      transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    .step-dot svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .step span {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
    }

    .step.active span,
    .step.done span {
      color: var(--text);
    }

    .step.active .step-dot,
    .step.done .step-dot {
      color: #fff;
    }

    /* Pending active = yellow clock */
    body[data-status="pending"] .step[data-step="pending"].active .step-dot {
      background: var(--pending);
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.35);
    }

    /* Approved: pending done (green), CHECK active (green), X stays gray */
    body[data-status="approved"] .step[data-step="pending"].done .step-dot,
    body[data-status="confirmed"] .step[data-step="pending"].done .step-dot,
    body[data-status="approved"] .step[data-step="approved"].active .step-dot,
    body[data-status="confirmed"] .step[data-step="approved"].active .step-dot {
      background: var(--approved);
      box-shadow: 0 4px 14px rgba(20, 108, 67, 0.32);
    }

    body[data-status="approved"] .step[data-step="cancelled"] .step-dot,
    body[data-status="confirmed"] .step[data-step="cancelled"] .step-dot {
      opacity: 0.45;
    }

    /* Cancelled: pending done (gray), CHECK skipped, X active (red) */
    body[data-status="cancelled"] .step[data-step="pending"].done .step-dot {
      background: #94a3b8;
    }

    body[data-status="cancelled"] .step[data-step="approved"] .step-dot {
      opacity: 0.4;
    }

    body[data-status="cancelled"] .step[data-step="cancelled"].active .step-dot {
      background: var(--cancelled);
      box-shadow: 0 4px 14px rgba(185, 28, 28, 0.32);
    }

    /* Section titles */
    .section-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--green-deep);
      margin-bottom: 0.95rem;
    }

    .section-title svg {
      width: 18px;
      height: 18px;
      stroke: var(--green-mid);
      fill: none;
      stroke-width: 1.8;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      align-items: center;
      gap: 0.65rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid rgba(13, 59, 46, 0.06);
    }

    .detail-row:last-child { border-bottom: none; padding-bottom: 0; }
    .detail-row:first-of-type { padding-top: 0; }

    .detail-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--green-mint);
      color: var(--green-deep);
      display: grid;
      place-items: center;
    }

    .detail-icon svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    .detail-row label {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .detail-row strong {
      font-size: 0.88rem;
      font-weight: 650;
      color: var(--text);
      text-align: right;
    }

    .next-card {
      background: #f3f5f4;
      border-style: dashed;
    }

    body[data-status="pending"] .next-card { background: var(--pending-soft); }
    body[data-status="approved"] .next-card,
    body[data-status="confirmed"] .next-card { background: var(--approved-soft); }
    body[data-status="cancelled"] .next-card { background: var(--cancelled-soft); }

    .next-card p {
      font-size: 0.86rem;
      line-height: 1.55;
      color: #4a5c54;
    }

    .cta-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0.25rem;
      animation: fadeUp 0.5s 0.25s ease both;
    }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.95rem 1rem;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 650;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .cta:hover { transform: translateY(-1px); filter: brightness(0.98); }

    .cta svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .cta-cancel {
      background: #fef2f2;
      color: var(--cancelled);
      border: 1.5px solid #f5c2c2;
    }

    .cta-primary {
      background: var(--green-deep);
      color: #fff;
    }

    .cta-ghost {
      background: var(--white);
      color: var(--green-deep);
      border: 1.5px solid rgba(13, 59, 46, 0.15);
    }

    .cta-again {
      background: var(--green-deep);
      color: #fff;
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(0.75rem, env(safe-area-inset-bottom));
      width: calc(100% - 1.75rem);
      max-width: 400px;
      height: 68px;
      z-index: 50;
      display: grid;
      grid-template-columns: 1fr 88px 1fr;
      align-items: center;
      padding: 0 0.35rem 0.15rem;
    }

    .nav-shell {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      filter: drop-shadow(0 10px 24px rgba(13, 59, 46, 0.14));
    }

    .nav-shell svg { width: 100%; height: 100%; display: block; }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.28rem;
      font-size: 0.72rem;
      font-weight: 500;
      color: #8a9a92;
      padding: 0.5rem 0.75rem;
      z-index: 1;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
    }

    .nav-home {
      position: relative;
      top: -30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      color: var(--green-mid);
      font-size: 0.72rem;
      font-weight: 600;
      z-index: 2;
    }

    .nav-home .fab {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(165deg, #247a58 0%, var(--green-deep) 100%);
      color: #fff;
      display: grid;
      place-items: center;
      border: 5px solid var(--bg);
      box-shadow:
        0 12px 28px rgba(13, 59, 46, 0.38),
        0 0 0 8px rgba(64, 145, 108, 0.1);
    }

    .nav-home .fab svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 431px) {
      body { padding: 1rem 0; background: #e8eee9; }
      .phone {
        min-height: calc(100vh - 2rem);
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(13, 59, 46, 0.12);
      }
      .bottom-nav { bottom: 1.1rem; }
      .page-bar { border-radius: 28px 28px 0 0; }
    }
  </style>
</head>
<body data-status="pending">
  <div class="phone">
    <header class="page-bar">
      <a class="back-btn" href="my-bookings.html" aria-label="Back to bookings">
        <svg viewBox="0 0 24 24"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>

    <main class="content">

        <span class="badge pending" id="statusBadge">Pending</span>
        <p class="id-label">Booking ID</p>
        <p class="booking-id" id="bookingId">-</p>

      <section class="card">

              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <span>Pending</span>
          </div>
          <div class="step" data-step="approved" id="stepApproved">
            <div class="step-dot">
              <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
            </div>
            <span>Approved</span>
          </div>
          <div class="step" data-step="cancelled" id="stepCancelled">
            <div class="step-dot">
              <svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </div>
            <span>Cancelled</span>
          </div>

      </section>

      <section class="card">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          Booking Details
        </h2>
        <div class="detail-row">
          <div class="detail-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></svg></div>
          <label>Service</label>
          <strong id="svc">-</strong>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></div>
          <label>Date</label>
          <strong id="date">-</strong>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
          <label>Time</label>
          <strong id="time">-</strong>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></div>
          <label>Price</label>
          <strong id="price">₱700.00</strong>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>
          Payment Information
        </h2>
        <div class="detail-row">
          <div class="detail-icon"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div>
          <label>Payment Method</label>
          <strong id="payMethod">GCash</strong>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></div>
          <label>Payment Status</label>
          <strong><span class="badge pending" id="payBadge" style="margin:0;">Pending</span></strong>

      <section class="card next-card">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
          What happens next?
        </h2>

      </section>

      <div class="cta-wrap" id="ctaWrap">
        <button type="button" class="cta cta-cancel" id="btnCancel">

      </div>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <div class="nav-shell" aria-hidden="true">

        <path fill="#ffffff" d="M28 0 H148 C158 0 164 6 170 14 C178 28 190 36 200 36 C210 36 222 28 230 14 C236 6 242 0 252 0 H372 C388 0 400 12 400 28 V68 H0 V28 C0 12 12 0 28 0 Z"/>

      Partnership
    </a>

      <span class="fab" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21V12h6v9"/></svg>
      </span>
      Home
    </a>

      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="maslog-db.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const status = (params.get("status") || "pending").toLowerCase();
    const id = params.get("id") || "-";
    const date = params.get("date") || "-";
    const time = params.get("time") || "-";
    const guests = params.get("guests") || "2";
    const price = params.get("price") || "₱700.00";
    const service = params.get("service") || "Cottage Rental & Entrance Fee";
    const method = params.get("method") || "Cash";
    const approvedBy = params.get("approvedBy") || "Admin / Staff";

    const normalized =
      status === "confirmed" ? "approved" :
      status === "cancelled" ? "cancelled" : "pending";

    document.body.dataset.status = normalized;

    const labels = {
      pending: "Pending",
      approved: "Approved",
      cancelled: "Cancelled",
    };

    const nextCopy = {
      pending: "Your booking is pending confirmation. We will review your request and notify you once confirmed.",
      approved: "Your booking is confirmed! Please show this screen or your QR e-receipt upon arrival at Maslog Cold Spring.",
      cancelled: "This booking has been cancelled. If this was a mistake, please contact customer service to rebook.",
    };

    document.getElementById("statusBadge").textContent = labels[normalized];
    document.getElementById("statusBadge").className = "badge " + normalized;
    document.getElementById("payBadge").textContent =
      normalized === "approved" ? "Paid" : labels[normalized];
    document.getElementById("payBadge").className = "badge " + normalized;
    document.getElementById("bookingId").textContent = "#" + id.replace(/^#/, "");
    document.getElementById("bookedOn").textContent = "Booked on " + date + " · " + time;
    document.getElementById("date").textContent = date;
    document.getElementById("time").textContent = time;
    document.getElementById("price").textContent = price;
    document.getElementById("svc").textContent = service;
    document.getElementById("nextText").textContent = nextCopy[normalized];

    // Progress: pending → check (approved) OR x (cancelled)
    const stepPending = document.getElementById("stepPending");
    const stepApproved = document.getElementById("stepApproved");
    const stepCancelled = document.getElementById("stepCancelled");
    const iconCheck = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
    const iconClock = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
    const iconX = '<svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';

    stepPending.className = "step";
    stepApproved.className = "step";
    stepCancelled.className = "step";

    if (normalized === "pending") {
      stepPending.classList.add("active");
      stepPending.querySelector(".step-dot").innerHTML = iconClock;
      stepApproved.querySelector(".step-dot").innerHTML = iconCheck;
      stepCancelled.querySelector(".step-dot").innerHTML = iconX;
    } else if (normalized === "approved") {
      // Proceed to CHECK
      stepPending.classList.add("done");
      stepApproved.classList.add("active");
      stepPending.querySelector(".step-dot").innerHTML = iconCheck;
      stepApproved.querySelector(".step-dot").innerHTML = iconCheck;
      stepCancelled.querySelector(".step-dot").innerHTML = iconX;
    } else {
      // Proceed to X
      stepPending.classList.add("done");
      stepCancelled.classList.add("active");
      stepPending.querySelector(".step-dot").innerHTML = iconCheck;
      stepApproved.querySelector(".step-dot").innerHTML = iconCheck;
      stepCancelled.querySelector(".step-dot").innerHTML = iconX;
    }

    async function cancelAndReleaseBooking() {
      if (!confirm("Cancel this booking and release the cottage?")) return;
      const buttons = document.querySelectorAll("#btnCancel, #btnCancelLate");
      buttons.forEach((btn) => {
        btn.disabled = true;
        btn.dataset.prevText = btn.textContent;
        btn.textContent = "Cancelling...";
      });
      try {
        await MaslogDB.cancelClientBooking(id);
        location.href = "booking-detail.html?status=cancelled&id=" + encodeURIComponent(id) +
          "&date=" + encodeURIComponent(date) + "&time=" + encodeURIComponent(time) +
          "&price=" + encodeURIComponent(price) + "&service=" + encodeURIComponent(service) +
          "&method=" + encodeURIComponent(method);
      } catch (err) {
        alert(err.message || "Could not cancel booking");
        buttons.forEach((btn) => {
          btn.disabled = false;
          btn.textContent = btn.dataset.prevText || "Cancel Booking";
        });
      }
    }

    // CTAs by status
    const cta = document.getElementById("ctaWrap");
    if (normalized === "approved") {
      const receiptUrl =
        "e-receipt.html?date=" + encodeURIComponent(date) +
        "&time=" + encodeURIComponent(time) +
        "&guests=" + encodeURIComponent(guests) +
        "&amount=" + encodeURIComponent(price) +
        "&method=" + encodeURIComponent(method) +
        "&trx=" + encodeURIComponent(id === "-" ? "" : id) +
        "&paid=" + encodeURIComponent(date + " · " + time) +
        "&id=" + encodeURIComponent(id) +
        "&service=" + encodeURIComponent(service) +
        "&approvedBy=" + encodeURIComponent(approvedBy);
      cta.innerHTML = `
        <a class="cta cta-primary" href="${receiptUrl}">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          Download E-Receipt
        </a>
        <button type="button" class="cta cta-ghost" id="btnCancelLate">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6"/><path d="m9 9 6 6"/></svg>
          Cancel Booking
        </button>`;
    } else if (normalized === "cancelled") {
      cta.innerHTML = `
        <a class="cta cta-again" href="user-dashboard.html">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="M12 14v4"/><path d="M10 16h4"/></svg>
          Book Again
        </a>
        <a class="cta cta-ghost" href="#">
          <svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/><path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
          Contact Support
        </a>`;
    } else {
      document.getElementById("btnCancel").addEventListener("click", cancelAndReleaseBooking);
    }
    document.getElementById("btnCancelLate")?.addEventListener("click", cancelAndReleaseBooking);
  </script>
</body>
</html>
