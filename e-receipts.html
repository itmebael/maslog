<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Maslog Cold Spring — E-Receipts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-deep: #0d3b2e;
      --green-mid: #2d6a4f;
      --green-bright: #40916c;
      --card-mint: #eef7f0;
      --text: #1a2e24;
      --text-muted: #6b7c74;
      --bg: #f6f8f6;
      --white: #ffffff;
      --sans: "Outfit", sans-serif;
      --nav-h: 88px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; border: none; cursor: pointer; background: none; }

    .phone {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      padding: 0 0 calc(var(--nav-h) + 1.25rem);
      display: flex;
      flex-direction: column;
    }

    .page-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 1.15rem 0.95rem;
      background: rgba(246, 248, 246, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(13, 59, 46, 0.06);
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--white);
      color: var(--green-deep);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px rgba(13, 59, 46, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .back-btn:hover {
      transform: translateX(-2px);
      box-shadow: 0 6px 18px rgba(13, 59, 46, 0.12);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .page-bar h1 {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green-deep);
    }

    .page-bar .spacer { width: 42px; }

    .content {
      padding: 1.15rem 1.25rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .intro {
      animation: fadeUp 0.45s ease both;
    }

    .intro p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .intro strong {
      color: var(--green-deep);
      font-weight: 650;
    }

    .booking-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .booking-card {
      display: block;
      background: var(--card-mint);
      border-radius: 20px;
      padding: 0.95rem;
      border: 1px solid rgba(13, 59, 46, 0.1);
      box-shadow: 0 8px 22px rgba(13, 59, 46, 0.05);
      animation: fadeUp 0.55s ease both;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      color: inherit;
    }

    .booking-card:nth-child(1) { animation-delay: 0.08s; }
    .booking-card:nth-child(2) { animation-delay: 0.14s; }

    .booking-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(13, 59, 46, 0.09);
    }

    .booking-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }

    .booking-thumb {
      width: 92px;
      height: 68px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(13, 59, 46, 0.12);
    }

    .status {
      font-size: 0.72rem;
      font-weight: 650;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: #b7efc5;
      color: #146c43;
    }

    .booking-body h2 {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--green-mid);
      margin-bottom: 0.45rem;
      line-height: 1.25;
    }

    .booking-meta {
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.84rem;
      color: #4a5c54;
      font-weight: 450;
    }

    .meta-row svg {
      width: 14px;
      height: 14px;
      stroke: var(--green-bright);
      fill: none;
      stroke-width: 1.8;
      flex-shrink: 0;
    }

    .booking-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.9rem;
      padding-top: 0.85rem;
      border-top: 1px dashed rgba(13, 59, 46, 0.12);
    }

    .btn-receipt {
      flex: 1;
      text-align: center;
      padding: 0.6rem 0.65rem;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--green-deep);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn-receipt svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .btn-receipt:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      display: none;
    }

    .empty.show { display: block; }

    .empty svg {
      width: 48px;
      height: 48px;
      stroke: var(--green-bright);
      fill: none;
      stroke-width: 1.5;
      margin-bottom: 0.75rem;
      opacity: 0.7;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(0.75rem, env(safe-area-inset-bottom));
      width: calc(100% - 1.75rem);
      max-width: 400px;
      height: 68px;
      z-index: 50;
      display: grid;
      grid-template-columns: 1fr 88px 1fr;
      align-items: center;
      padding: 0 0.35rem 0.15rem;
    }

    .nav-shell {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      filter: drop-shadow(0 10px 24px rgba(13, 59, 46, 0.14));
    }

    .nav-shell svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.28rem;
      font-size: 0.72rem;
      font-weight: 500;
      color: #8a9a92;
      padding: 0.5rem 0.75rem;
      z-index: 1;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
    }

    .nav-home {
      position: relative;
      top: -30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      color: var(--green-mid);
      font-size: 0.72rem;
      font-weight: 600;
      z-index: 2;
    }

    .nav-home .fab {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(165deg, #247a58 0%, var(--green-deep) 100%);
      color: #fff;
      display: grid;
      place-items: center;
      border: 5px solid var(--bg);
      box-shadow:
        0 12px 28px rgba(13, 59, 46, 0.38),
        0 0 0 8px rgba(64, 145, 108, 0.1);
    }

    .nav-home .fab svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 431px) {
      body { padding: 1rem 0; background: #e8eee9; }
      .phone {
        min-height: calc(100vh - 2rem);
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(13, 59, 46, 0.12);
      }
      .bottom-nav { bottom: 1.1rem; }
      .page-bar { border-radius: 28px 28px 0 0; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="page-bar">
      <a class="back-btn" href="user-dashboard.html" aria-label="Back to home">
        <svg viewBox="0 0 24 24"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <h1>E-Receipts</h1>
      <div class="spacer" aria-hidden="true"></div>
    </header>

    <main class="content">
      <div class="intro">
        <p>Showing <strong>approved bookings</strong> only. Tap a receipt to view, print, or share.</p>
      </div>

      <div class="booking-list" id="receiptList"></div>

      <div class="empty" id="emptyState">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <p>No approved bookings with receipts yet.</p>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <div class="nav-shell" aria-hidden="true">
      <svg viewBox="0 0 400 68" preserveAspectRatio="none">
        <path
          fill="#ffffff"
          d="M28 0
             H148
             C158 0 164 6 170 14
             C178 28 190 36 200 36
             C210 36 222 28 230 14
             C236 6 242 0 252 0
             H372
             C388 0 400 12 400 28
             V68 H0 V28
             C0 12 12 0 28 0 Z"
        />
      </svg>
    </div>
    <a class="nav-item" href="partnership.html">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Partnership
    </a>
    <a class="nav-home" href="user-dashboard.html">
      <span class="fab" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21V12h6v9"/></svg>
      </span>
      Home
    </a>
    <a class="nav-item" href="profile.html">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="maslog-db.js"></script>
  <script>
    (async function loadClientReceiptsFromDatabase() {
      const session = MaslogConfig.getSession();
      if (!session || session.role !== "client") {
        location.href = "index.html";
        return;
      }

      const list = document.getElementById("receiptList");
      const empty = document.getElementById("emptyState");
      list.innerHTML = "";

      const bookings = (await MaslogDB.listClientBookings(session.userId)).filter((b) => b.status === "confirmed");
      bookings.forEach((b) => {
        const guests = Number(b.entrance?.adult || 0) + Number(b.entrance?.child || 0) + Number(b.entrance?.senior || 0);
        const dateLabel = MaslogDB.formatDate(b.date);
        const amount = MaslogDB.formatMoney(b.total);
        const service = encodeURIComponent(b.propertyName || "Maslog Cold Spring Resort");
        const method = encodeURIComponent(String(b.payment || "cash").toLowerCase() === "gcash" ? "GCash" : "Cash");
        const approvedBy = encodeURIComponent(b.approvedBy || "Admin / Staff");
        const href = `e-receipt.html?date=${encodeURIComponent(dateLabel)}&time=09:00%20AM&guests=${guests}&amount=${encodeURIComponent(amount)}&method=${method}&trx=${encodeURIComponent(b.id)}&paid=${encodeURIComponent(dateLabel)}&id=${encodeURIComponent(b.id)}&service=${service}&approvedBy=${approvedBy}`;
        const card = document.createElement("a");
        card.className = "booking-card";
        card.href = href;
        card.innerHTML = `
          <div class="booking-top">
            <img class="booking-thumb" src="backg.png" alt="Maslog Cold Spring" />
            <span class="status">Approved</span>
          </div>
          <div class="booking-body">
            <h2>${b.propertyName || "Maslog Cold Spring Resort"}</h2>
            <div class="booking-meta">
              <p class="meta-row">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
                ${dateLabel} · 09:00 AM
              </p>
              <p class="meta-row">
                <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                ${guests} Guest${guests !== 1 ? "s" : ""} · ${amount}
              </p>
              <p class="meta-row">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                ${b.id}
              </p>
            </div>
          </div>
          <div class="booking-actions">
            <span class="btn-receipt">
              <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
              View E-Receipt
            </span>
          </div>`;
        list.appendChild(card);
      });

      empty.classList.toggle("show", bookings.length === 0);
    })().catch((err) => {
      document.getElementById("receiptList").innerHTML = "";
      const empty = document.getElementById("emptyState");
      empty.querySelector("p").textContent = err.message || "Could not load your receipts.";
      empty.classList.add("show");
    });
  </script>
</body>
</html>
