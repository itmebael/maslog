<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Maslog Cold Spring — Partnership</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --green-deep:#0d3b2e; --green-mid:#2d6a4f; --green-bright:#40916c; --green-mint:#e8f5e9; --text:#1a2e24; --text-muted:#6b7c74; --bg:#f6f8f6; --white:#fff; --serif:"Cormorant Garamond",Georgia,serif; --sans:"Outfit",sans-serif; --radius:18px; --nav-h:88px; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);display:flex;justify-content:center;min-height:100vh}
    a{text-decoration:none;color:inherit}
    .phone{width:100%;max-width:430px;min-height:100vh;padding:0 1.15rem calc(var(--nav-h)+1.25rem)}
    .page-bar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:1rem 0 .85rem;background:rgba(246,248,246,.92);backdrop-filter:blur(12px)}
    .back-btn{width:42px;height:42px;border-radius:50%;background:var(--white);display:grid;place-items:center;box-shadow:0 4px 14px rgba(13,59,46,.08);color:var(--green-deep)}
    .page-bar h1{font-family:var(--serif);font-size:1.35rem;text-align:center;color:var(--green-deep)}
    .hero{background:var(--white);border-radius:22px;padding:1.25rem;box-shadow:0 8px 24px rgba(13,59,46,.08);text-align:center;margin-bottom:1rem}
    .hero img{width:88px;height:88px;border-radius:18px;object-fit:cover;margin-bottom:.85rem;border:2px solid var(--green-mint)}
    .hero h2{font-family:var(--serif);font-size:1.4rem;color:var(--green-deep);margin-bottom:.35rem}
    .hero p{font-size:.85rem;color:var(--text-muted);line-height:1.5}
    .rates{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin:1rem 0}
    .rate-box{background:var(--green-mint);border-radius:14px;padding:.85rem;text-align:center}
    .rate-box strong{display:block;font-size:1.1rem;color:var(--green-deep)}
    .rate-box span{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
    .card{background:var(--white);border-radius:var(--radius);padding:1.1rem;box-shadow:0 6px 20px rgba(13,59,46,.06);margin-bottom:.85rem}
    .card h3{font-size:.95rem;color:var(--green-deep);margin-bottom:.5rem}
    .card p{font-size:.85rem;color:var(--text-muted);line-height:1.5}
    .btn{display:block;width:100%;padding:.85rem;border-radius:999px;font-weight:600;font-size:.9rem;text-align:center;background:linear-gradient(165deg,#247a58,var(--green-deep));color:#fff;box-shadow:0 8px 20px rgba(13,59,46,.22);margin-top:.5rem}
    .unavail{background:#ffebee;color:#c62828;padding:.65rem .85rem;border-radius:12px;font-size:.82rem;font-weight:600;text-align:center;margin-bottom:.85rem}
    .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(.75rem,env(safe-area-inset-bottom));width:calc(100% - 1.75rem);max-width:400px;height:68px;z-index:50;display:grid;grid-template-columns:1fr 88px 1fr;align-items:center;padding:0 .35rem .15rem}
    .nav-shell{position:absolute;inset:0;z-index:-1;pointer-events:none;filter:drop-shadow(0 10px 24px rgba(13,59,46,.14))}
    .nav-shell svg{width:100%;height:100%}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:.28rem;font-size:.72rem;font-weight:500;color:#8a9a92;z-index:1}
    .nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
    .nav-item.active{color:var(--green-mid);font-weight:600}
    .nav-home{position:relative;top:-30px;display:flex;flex-direction:column;align-items:center;gap:.35rem;color:var(--green-mid);font-size:.72rem;font-weight:600;z-index:2}
    .nav-home .fab{width:60px;height:60px;border-radius:50%;background:linear-gradient(165deg,#247a58,var(--green-deep));color:#fff;display:grid;place-items:center;border:5px solid var(--bg);box-shadow:0 12px 28px rgba(13,59,46,.38)}
    .nav-home .fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}
    @media(min-width:431px){body{padding:1rem 0;background:#e8eee9}.phone{border-radius:28px;box-shadow:0 20px 50px rgba(13,59,46,.12);background:var(--bg)}}
  </style>
</head>
<body>
  <div class="phone">
    <header class="page-bar">
      <a class="back-btn" href="user-dashboard.html" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></a>
      <h1>Partnership</h1><span></span>
    </header>

    <div id="unavailBanner" class="unavail" hidden>Partnership is currently not available.</div>

    <section class="hero" id="partnerHero">
      <img id="partnerLogo" src="backg.png" alt="Partnership logo" />
      <h2 id="partnerName">—</h2>
      <p id="partnerDesc">—</p>
      <div class="rates">
        <div class="rate-box"><span>Per Hour</span><strong id="rateHour">—</strong></div>
        <div class="rate-box"><span>Per Day</span><strong id="rateDay">—</strong></div>
      </div>
    </section>

    <section class="card">
      <h3>What's Included</h3>
      <p id="partnerDetails">Partnership details are set by resort staff. Add this option when booking online.</p>
    </section>

    <a class="btn" href="book-online.html">Book with Partnership</a>
  </div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <div class="nav-shell" aria-hidden="true"><svg viewBox="0 0 400 68" preserveAspectRatio="none"><path fill="#fff" d="M28 0 H148 C158 0 164 6 170 14 C178 28 190 36 200 36 C210 36 222 28 230 14 C236 6 242 0 252 0 H372 C388 0 400 12 400 28 V68 H0 V28 C0 12 12 0 28 0 Z"/></svg></div>
    <a class="nav-item active" href="partnership.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Partnership</a>
    <a class="nav-home" href="user-dashboard.html"><span class="fab"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21V12h6v9"/></svg></span>Home</a>
    <a class="nav-item" href="profile.html"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Profile</a>
  </nav>

  <script src="user-app.js"></script>
  <script>
    const p = MaslogUser.loadFees().partnership;
    document.getElementById("partnerLogo").src = p.logo || "backg.png";
    document.getElementById("partnerName").textContent = p.name || "Partnership";
    document.getElementById("partnerDesc").textContent = p.description || "";
    document.getElementById("partnerDetails").textContent = p.description || "Contact staff for partnership details.";
    document.getElementById("rateHour").textContent = MaslogUser.formatMoney(p.perHour);
    document.getElementById("rateDay").textContent = MaslogUser.formatMoney(p.perDay);
    if (p.available === false) {
      document.getElementById("unavailBanner").hidden = false;
      document.querySelector(".btn").style.opacity = "0.5";
      document.querySelector(".btn").style.pointerEvents = "none";
    }
  </script>
</body>
</html>
