<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Maslog Cold Spring — My Bookings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-deep: #0d3b2e;
      --green: #1b5e45;
      --green-mid: #2d6a4f;
      --green-bright: #40916c;
      --green-soft: #d8f3dc;
      --green-mint: #e8f5e9;
      --card-mint: #eef7f0;
      --text: #1a2e24;
      --text-muted: #6b7c74;
      --bg: #f6f8f6;
      --white: #ffffff;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Outfit", sans-serif;
      --radius: 18px;
      --nav-h: 88px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; border: none; cursor: pointer; background: none; }

    .phone {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      padding: 0 0 calc(var(--nav-h) + 1.25rem);
      display: flex;
      flex-direction: column;
    }

    /* ——— Top bar ——— */
    .page-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 1.15rem 0.95rem;
      background: rgba(246, 248, 246, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(13, 59, 46, 0.06);
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--white);
      color: var(--green-deep);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px rgba(13, 59, 46, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .back-btn:hover {
      transform: translateX(-2px);
      box-shadow: 0 6px 18px rgba(13, 59, 46, 0.12);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .page-bar h1 {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green-deep);
    }

    .page-bar .spacer { width: 42px; }

    /* ——— Content ——— */
    .content {
      padding: 1.15rem 1.25rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .summary {
      display: flex;
      gap: 0.65rem;
      animation: fadeUp 0.45s ease both;
    }

    .summary-chip {
      flex: 1;
      background: var(--white);
      border-radius: 14px;
      padding: 0.85rem 0.9rem;
      box-shadow: 0 6px 18px rgba(13, 59, 46, 0.05);
    }

    .summary-chip span {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .summary-chip strong {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--green-deep);
    }

    .filter-row {
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      padding-bottom: 0.15rem;
      animation: fadeUp 0.5s 0.05s ease both;
      scrollbar-width: none;
    }

    .filter-row::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0;
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 550;
      color: var(--text-muted);
      background: var(--white);
      border: 1px solid rgba(13, 59, 46, 0.08);
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .filter-btn.active {
      background: var(--green-deep);
      color: #fff;
      border-color: var(--green-deep);
    }

    /* ——— Booking cards ——— */
    .booking-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .booking-card {
      display: block;
      background: var(--card-mint);
      border-radius: 20px;
      padding: 0.95rem;
      border: 1px solid rgba(13, 59, 46, 0.1);
      box-shadow: 0 8px 22px rgba(13, 59, 46, 0.05);
      animation: fadeUp 0.55s ease both;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      color: inherit;
    }

    .booking-card:nth-child(1) { animation-delay: 0.08s; }
    .booking-card:nth-child(2) { animation-delay: 0.14s; }
    .booking-card:nth-child(3) { animation-delay: 0.2s; }
    .booking-card:nth-child(4) { animation-delay: 0.26s; }

    .booking-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(13, 59, 46, 0.09);
    }

    .booking-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }

    .booking-thumb {
      width: 92px;
      height: 68px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(13, 59, 46, 0.12);
    }

    .status {
      font-size: 0.72rem;
      font-weight: 650;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      letter-spacing: 0.01em;
    }

    .status.confirmed {
      background: #b7efc5;
      color: #146c43;
    }

    .status.pending {
      background: #fef3c7;
      color: #d97706;
    }

    .status.cancelled {
      background: #fecaca;
      color: #b91c1c;
    }

    .booking-body h2 {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--green-mid);
      margin-bottom: 0.45rem;
      line-height: 1.25;
    }

    .booking-meta {
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.84rem;
      color: #4a5c54;
      font-weight: 450;
    }

    .meta-row svg {
      width: 14px;
      height: 14px;
      stroke: var(--green-bright);
      fill: none;
      stroke-width: 1.8;
      flex-shrink: 0;
    }

    .booking-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.9rem;
      padding-top: 0.85rem;
      border-top: 1px dashed rgba(13, 59, 46, 0.12);
    }

    .booking-actions a,
    .booking-actions button,
    .booking-actions span {
      flex: 1;
      text-align: center;
      padding: 0.55rem 0.65rem;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
      transition: filter 0.15s ease, transform 0.15s ease;
      display: block;
    }

    .booking-actions a:hover,
    .booking-actions button:hover {
      transform: translateY(-1px);
    }

    .btn-view {
      background: var(--white);
      color: var(--green-deep);
      border: 1px solid rgba(13, 59, 46, 0.12);
    }

    .btn-receipt {
      background: var(--green-deep);
      color: #fff;
    }

    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      display: none;
    }

    .empty.show { display: block; }

    .empty svg {
      width: 48px;
      height: 48px;
      stroke: var(--green-bright);
      fill: none;
      stroke-width: 1.5;
      margin-bottom: 0.75rem;
      opacity: 0.7;
    }

    /* ——— Bottom nav ——— */
    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(0.75rem, env(safe-area-inset-bottom));
      width: calc(100% - 1.75rem);
      max-width: 400px;
      height: 68px;
      z-index: 50;
      display: grid;
      grid-template-columns: 1fr 88px 1fr;
      align-items: center;
      padding: 0 0.35rem 0.15rem;
    }

    .nav-shell {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      filter: drop-shadow(0 10px 24px rgba(13, 59, 46, 0.14));
    }

    .nav-shell svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.28rem;
      font-size: 0.72rem;
      font-weight: 500;
      color: #8a9a92;
      padding: 0.5rem 0.75rem;
      transition: color 0.2s ease, transform 0.2s ease;
      z-index: 1;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
    }

    .nav-item:hover {
      color: var(--green-mid);
      transform: translateY(-1px);
    }

    .nav-home {
      position: relative;
      top: -30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      color: var(--green-mid);
      font-size: 0.72rem;
      font-weight: 600;
      z-index: 2;
    }

    .nav-home .fab {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(165deg, #247a58 0%, var(--green-deep) 100%);
      color: #fff;
      display: grid;
      place-items: center;
      border: 5px solid var(--bg);
      box-shadow:
        0 12px 28px rgba(13, 59, 46, 0.38),
        0 0 0 8px rgba(64, 145, 108, 0.1);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .nav-home:hover .fab {
      transform: scale(1.05) translateY(-2px);
      box-shadow:
        0 16px 32px rgba(13, 59, 46, 0.42),
        0 0 0 10px rgba(64, 145, 108, 0.14);
    }

    .nav-home .fab svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 431px) {
      body { padding: 1rem 0; background: #e8eee9; }
      .phone {
        min-height: calc(100vh - 2rem);
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(13, 59, 46, 0.12);
      }
      .bottom-nav { bottom: 1.1rem; }
      .page-bar { border-radius: 28px 28px 0 0; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="page-bar">
      <a class="back-btn" href="user-dashboard.html" aria-label="Back to home">
        <svg viewBox="0 0 24 24"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <h1>My Bookings</h1>
      <div class="spacer" aria-hidden="true"></div>
    </header>

    <main class="content">
      <div class="summary">
        <div class="summary-chip">
          <span>Upcoming</span>
          <strong>3</strong>
        </div>
        <div class="summary-chip">
          <span>Confirmed</span>
          <strong>2</strong>
        </div>
        <div class="summary-chip">
          <span>Cancelled</span>
          <strong>1</strong>
        </div>
      </div>

      <div class="filter-row" role="tablist" aria-label="Filter bookings">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="confirmed">Confirmed</button>
        <button type="button" class="filter-btn" data-filter="pending">Pending</button>
        <button type="button" class="filter-btn" data-filter="cancelled">Cancelled</button>
      </div>

      <section class="booking-list" id="bookingList" aria-label="Your bookings"></section>

      <div class="empty" id="emptyState">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        <p>No bookings in this filter.</p>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <div class="nav-shell" aria-hidden="true">
      <svg viewBox="0 0 400 68" preserveAspectRatio="none">
        <path
          fill="#ffffff"
          d="M28 0
             H148
             C158 0 164 6 170 14
             C178 28 190 36 200 36
             C210 36 222 28 230 14
             C236 6 242 0 252 0
             H372
             C388 0 400 12 400 28
             V68 H0 V28
             C0 12 12 0 28 0 Z"
        />
      </svg>
    </div>
    <a class="nav-item" href="partnership.html">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Partnership
    </a>
    <a class="nav-home" href="user-dashboard.html">
      <span class="fab" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21V12h6v9"/></svg>
      </span>
      Home
    </a>
    <a class="nav-item" href="profile.html">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="maslog-db.js"></script>
  <script src="user-app.js"></script>
  <script>
    (function injectUserBookings() {
      const list = document.getElementById("bookingList");
      const user = MaslogUser.getCurrentUser();
      const saved = MaslogUser.loadBookings().filter((b) => !user.email || b.email === user.email);
      saved.forEach((b) => {
        const guests = (b.entrance?.adult || 0) + (b.entrance?.child || 0) + (b.entrance?.senior || 0);
        const dateLabel = MaslogUser.formatDate(b.date);
        const price = MaslogUser.formatMoney(b.total);
        const service = encodeURIComponent(b.propertyName || "Booking");
        const href = `booking-detail.html?status=${b.status}&id=${encodeURIComponent(b.id)}&date=${encodeURIComponent(dateLabel)}&time=09:00%20AM&guests=${guests}&price=${encodeURIComponent(price)}&service=${service}`;
        const card = document.createElement("a");
        card.className = "booking-card";
        card.dataset.status = b.status;
        card.href = href;
        card.innerHTML = `
          <div class="booking-top">
            <img class="booking-thumb" src="backg.png" alt="Maslog Cold Spring" />
            <span class="status ${b.status}">${b.status.charAt(0).toUpperCase() + b.status.slice(1)}</span>
          </div>
          <div class="booking-body">
            <h2>Maslog Cold Spring Resort</h2>
            <div class="booking-meta">
              <p class="meta-row">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
                ${dateLabel}
              </p>
              <p class="meta-row">
                <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                ${guests} Guest${guests !== 1 ? "s" : ""}
              </p>
            </div>
          </div>
          <div class="booking-actions">
            <span class="btn-view">View Details</span>
            <span class="btn-receipt">${b.status === "confirmed" ? "E-Receipt" : "Awaiting"}</span>
          </div>`;
        list.insertBefore(card, list.firstChild);
      });
    })();

    const buttons = [...document.querySelectorAll(".filter-btn")];
    const cards = () => [...document.querySelectorAll(".booking-card")];
    const empty = document.getElementById("emptyState");

    function applyFilter(filter) {
      let visible = 0;
      cards().forEach((card) => {
        const show = filter === "all" || card.dataset.status === filter;
        card.style.display = show ? "" : "none";
        if (show) visible += 1;
      });
      empty.classList.toggle("show", visible === 0);
    }

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        buttons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        applyFilter(btn.dataset.filter);
      });
    });

    document.querySelectorAll(".btn-receipt[data-receipt]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        location.href = btn.dataset.receipt;
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="maslog-db.js"></script>
  <script>
    (async function loadClientBookingsFromDatabase() {
      const session = MaslogConfig.getSession();
      if (!session || session.role !== "client") {
        location.href = "index.html";
        return;
      }

      const list = document.getElementById("bookingList");
      const empty = document.getElementById("emptyState");
      list.innerHTML = "";

      const bookings = await MaslogDB.listClientBookings(session.userId);
      const counts = {
        upcoming: bookings.filter((b) => ["pending", "confirmed"].includes(b.status)).length,
        confirmed: bookings.filter((b) => b.status === "confirmed").length,
        cancelled: bookings.filter((b) => b.status === "cancelled").length,
      };
      const summary = document.querySelectorAll(".summary-chip strong");
      if (summary[0]) summary[0].textContent = counts.upcoming;
      if (summary[1]) summary[1].textContent = counts.confirmed;
      if (summary[2]) summary[2].textContent = counts.cancelled;

      bookings.forEach((b) => {
        const guests = Number(b.entrance?.adult || 0) + Number(b.entrance?.child || 0) + Number(b.entrance?.senior || 0);
        const dateLabel = MaslogDB.formatDate(b.date);
        const price = MaslogDB.formatMoney(b.total);
        const service = encodeURIComponent(b.propertyName || "Entrance Fee");
        const method = encodeURIComponent(String(b.payment || "cash").toLowerCase() === "gcash" ? "GCash" : "Cash");
        const approvedBy = encodeURIComponent(b.approvedBy || "Admin / Staff");
        const href = `booking-detail.html?status=${encodeURIComponent(b.status)}&id=${encodeURIComponent(b.id)}&date=${encodeURIComponent(dateLabel)}&time=09:00%20AM&guests=${guests}&price=${encodeURIComponent(price)}&service=${service}&method=${method}&approvedBy=${approvedBy}`;
        const receiptHref = `e-receipt.html?date=${encodeURIComponent(dateLabel)}&time=09:00%20AM&guests=${guests}&amount=${encodeURIComponent(price)}&method=${method}&trx=${encodeURIComponent(b.id)}&paid=${encodeURIComponent(dateLabel)}&id=${encodeURIComponent(b.id)}&service=${service}&approvedBy=${approvedBy}`;
        const card = document.createElement("a");
        card.className = "booking-card";
        card.dataset.status = b.status;
        card.href = href;
        card.innerHTML = `
          <div class="booking-top">
            <img class="booking-thumb" src="backg.png" alt="Maslog Cold Spring" />
            <span class="status ${b.status}">${String(b.status || "pending").charAt(0).toUpperCase() + String(b.status || "pending").slice(1)}</span>
          </div>
          <div class="booking-body">
            <h2>${b.propertyName || "Maslog Cold Spring Resort"}</h2>
            <div class="booking-meta">
              <p class="meta-row">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
                ${dateLabel} · 09:00 AM
              </p>
              <p class="meta-row">
                <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                ${guests} Guest${guests !== 1 ? "s" : ""} · ${price}
              </p>
            </div>
          </div>
          <div class="booking-actions">
            <span class="btn-view">View Details</span>
            <span class="btn-receipt" ${b.status === "confirmed" ? `data-receipt="${receiptHref}"` : ""}>${b.status === "confirmed" ? "E-Receipt" : "Awaiting"}</span>
          </div>`;
        list.appendChild(card);
      });

      function applyActiveFilter() {
        const active = document.querySelector(".filter-btn.active")?.dataset.filter || "all";
        let visible = 0;
        [...document.querySelectorAll(".booking-card")].forEach((card) => {
          const show = active === "all" || card.dataset.status === active;
          card.style.display = show ? "" : "none";
          if (show) visible += 1;
        });
        empty.classList.toggle("show", visible === 0);
      }

      document.querySelectorAll(".btn-receipt[data-receipt]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          location.href = btn.dataset.receipt;
        });
      });

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => setTimeout(applyActiveFilter, 0));
      });
      applyActiveFilter();
    })().catch((err) => {
      document.getElementById("bookingList").innerHTML = "";
      const empty = document.getElementById("emptyState");
      empty.querySelector("p").textContent = err.message || "Could not load your bookings.";
      empty.classList.add("show");
    });
  </script>
</body>
</html>
